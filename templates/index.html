<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal AI Assistant</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f8fafc; margin: 0; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { color: #1e293b; margin-top: 0; }
        textarea { width: 100%; height: 120px; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        button { margin-top: 1rem; padding: 0.75rem 1.5rem; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
        button:hover { background-color: #1d4ed8; }
        #output-box { margin-top: 2rem; padding: 1rem; background: #f1f5f9; border-radius: 6px; white-space: pre-wrap; font-family: monospace; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Legal AI Assistant</h1>
        <p>Enter your legal issue or problem below:</p>
        <textarea id="problem" placeholder="Describe your legal problem in plain language..."></textarea>
        <br>
        <button onclick="submitProblem()">Get Legal Analysis</button>
        <div id="output-box"></div>
    </div>

    <script>
        async function submitProblem() {
            const problem = document.getElementById("problem").value;
            const outputBox = document.getElementById("output-box");
            if (!problem.trim()) return alert("Please enter a legal problem.");
            outputBox.style.display = "block";
            outputBox.innerText = "Analyzing legal problem...";
            try {
                const res = await fetch("/solve/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ problem: problem })
                });
                const data = await res.json();
                outputBox.innerText = data.output;
            } catch (err) {
                outputBox.innerText = "Error: " + err.message;
            }
        }
    </script>
</body>
</html>
